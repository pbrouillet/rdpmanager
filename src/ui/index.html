<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y. - Remote Desktop Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
                </svg>
                <span class="logo-text">F.R.I.D.A.Y.</span>
            </div>
            <div class="header-subtitle">Remote Desktop Interface</div>
            <div class="header-status" id="status">
                <span class="status-dot"></span>
                <span class="status-text">Systems Online</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- New Connection Panel -->
            <section class="panel connection-panel">
                <h2 class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    New Connection
                </h2>
                
                <form id="connectionForm" class="connection-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hostname">Hostname / IP</label>
                            <input type="text" id="hostname" placeholder="server.domain.com" required>
                        </div>
                        <div class="form-group form-group-small">
                            <label for="port">Port</label>
                            <input type="number" id="port" value="3389" min="1" max="65535">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" placeholder="user@domain.com">
                        </div>
                        <div class="form-group">
                            <label for="domain">Domain</label>
                            <input type="text" id="domain" placeholder="DOMAIN">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="saveBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17,21 17,13 7,13 7,21"/>
                                <polyline points="7,3 7,8 15,8"/>
                            </svg>
                            Save
                        </button>
                        <button type="submit" class="btn btn-primary" id="connectBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                            Connect
                        </button>
                    </div>
                </form>
            </section>

            <!-- Saved Connections -->
            <section class="panel saved-panel">
                <h2 class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    Saved Connections
                </h2>
                
                <div class="connections-list" id="connectionsList">
                    <!-- Connections will be populated by JavaScript -->
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                        <p>No saved connections yet</p>
                        <p class="empty-hint">Fill in the form above and click Save</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-info" id="appInfo">
                WebUI RDP Client v0.1.0
            </div>
        </footer>
    </div>

    <!-- Save Connection Modal -->
    <div class="modal" id="saveModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Save Connection</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="connectionName">Connection Name</label>
                    <input type="text" id="connectionName" placeholder="My Server">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
