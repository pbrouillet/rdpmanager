[workspace]
members = ["crates/webui-sys", "crates/freerdp-sys"]
resolver = "2"

[package]
name = "rdpmanager"
version = "1.0.0"
edition = "2021"
description = "Native RDP client with React/Fluent UI frontend"

[[bin]]
name = "rdpmanager"
path = "src/main.rs"

[dependencies]
webui-sys = { path = "crates/webui-sys" }
freerdp-sys = { path = "crates/freerdp-sys" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# HTTP client (blocking, minimal)
ureq = "3"

# XML parsing
quick-xml = { version = "0.37", features = ["serialize"] }

# Crypto
sha2 = "0.10"
base64 = "0.22"

# Utilities
uuid = { version = "1", features = ["v4"] }
url = "2"
dirs = "6"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
