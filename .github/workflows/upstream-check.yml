name: Upstream Patch Freshness

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-freerdp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone latest FreeRDP
        run: |
          git clone --depth 1 https://github.com/FreeRDP/FreeRDP.git /tmp/freerdp-latest
          echo "FREERDP_SHA=$(git -C /tmp/freerdp-latest rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "FREERDP_REF=$(git -C /tmp/freerdp-latest describe --tags --always 2>/dev/null || echo unknown)" >> $GITHUB_ENV

      - name: Test FreeRDP patch
        id: freerdp-patch
        continue-on-error: true
        run: |
          PATCH="patches/freerdp/aad-fallback-parse.patch"
          if git -C /tmp/freerdp-latest apply --check "$GITHUB_WORKSPACE/$PATCH" 2>/tmp/freerdp-err.txt; then
            echo "status=clean" >> $GITHUB_OUTPUT
            echo "✅ FreeRDP patch applies cleanly against ${{ env.FREERDP_REF }}"
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "❌ FreeRDP patch CONFLICTS against ${{ env.FREERDP_REF }}"
            cat /tmp/freerdp-err.txt
          fi

      - name: Open issue on FreeRDP conflict
        if: steps.freerdp-patch.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ FreeRDP patch conflict at ${process.env.FREERDP_REF}`;
            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-patch',
              per_page: 100,
            });
            const already = existing.data.find(i => i.title.startsWith('⚠️ FreeRDP patch conflict'));
            if (already) {
              console.log(`Issue #${already.number} already open — skipping`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## FreeRDP Patch No Longer Applies',
                '',
                `**Upstream ref:** \`${process.env.FREERDP_REF}\` (\`${process.env.FREERDP_SHA}\`)`,
                `**Patch:** \`patches/freerdp/aad-fallback-parse.patch\``,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### What to do',
                '1. Check the workflow logs for conflict details',
                '2. Rebase the patch against the new upstream',
                '3. Update the patch file and submodule ref',
                '4. Use the **Upstream Bump** workflow to create a PR',
                '',
                '_This issue was auto-created by the Upstream Patch Freshness workflow._',
              ].join('\n'),
              labels: ['upstream-patch'],
            });

  check-webui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone latest WebUI
        run: |
          git clone --depth 1 https://github.com/webui-dev/webui.git /tmp/webui-latest
          echo "WEBUI_SHA=$(git -C /tmp/webui-latest rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "WEBUI_REF=$(git -C /tmp/webui-latest describe --tags --always 2>/dev/null || echo unknown)" >> $GITHUB_ENV

      - name: Test WebUI patch
        id: webui-patch
        continue-on-error: true
        run: |
          PATCH="patches/webui/navigate-passthrough.patch"
          if git -C /tmp/webui-latest apply --check "$GITHUB_WORKSPACE/$PATCH" 2>/tmp/webui-err.txt; then
            echo "status=clean" >> $GITHUB_OUTPUT
            echo "✅ WebUI patch applies cleanly against ${{ env.WEBUI_REF }}"
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "❌ WebUI patch CONFLICTS against ${{ env.WEBUI_REF }}"
            cat /tmp/webui-err.txt
          fi

      - name: Open issue on WebUI conflict
        if: steps.webui-patch.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ WebUI patch conflict at ${process.env.WEBUI_REF}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-patch',
              per_page: 100,
            });
            const already = existing.data.find(i => i.title.startsWith('⚠️ WebUI patch conflict'));
            if (already) {
              console.log(`Issue #${already.number} already open — skipping`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## WebUI Patch No Longer Applies',
                '',
                `**Upstream ref:** \`${process.env.WEBUI_REF}\` (\`${process.env.WEBUI_SHA}\`)`,
                `**Patch:** \`patches/webui/navigate-passthrough.patch\``,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### What to do',
                '1. Check the workflow logs for conflict details',
                '2. Rebase the patch against the new upstream',
                '3. Update the patch file and submodule ref',
                '4. Use the **Upstream Bump** workflow to create a PR',
                '',
                '_This issue was auto-created by the Upstream Patch Freshness workflow._',
              ].join('\n'),
              labels: ['upstream-patch'],
            });
