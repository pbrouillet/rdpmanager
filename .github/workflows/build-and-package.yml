name: Build And Package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init FreeRDP submodule
        run: git submodule update --init subprojects/freerdp

      - name: Make scripts executable
        run: chmod +x init.sh setup-deps.sh scripts/check-freerdp-patch.sh

      - name: Install dependencies
        run: ./setup-deps.sh

      - name: Build application (setup + debug build)
        run: ./init.sh

      - name: Build release with embedded UI
        run: |
          meson setup build-release --buildtype=release -Dembed_ui=true
          ninja -C build-release

      - name: Install patchelf
        run: sudo apt-get install -y -qq patchelf

      - name: Package artifact
        run: |
          set -euo pipefail
          BUILD=build-release
          mkdir -p dist/rdpmanager/lib

          cp "$BUILD/webui-rdp-client" dist/rdpmanager/
          cp appicon.png dist/rdpmanager/

          # Libraries expected on any Linux desktop — never bundle these.
          SKIP_LIBS="linux-vdso|ld-linux"
          SKIP_LIBS+="|libc\.so|libm\.so|libdl\.so|librt\.so|libpthread\.so|libmvec\.so|libresolv\.so"
          SKIP_LIBS+="|libstdc\+\+|libgcc_s|libatomic|libgomp"
          SKIP_LIBS+="|libX[a-z0-9]|libxcb|libxkbfile|libxshmfence|libSM|libICE"
          SKIP_LIBS+="|libsystemd|libudev|libdbus"
          SKIP_LIBS+="|libicu"
          SKIP_LIBS+="|libffi|libpcre|libselinux|libcap|libgpg-error|libgcrypt|liblzma|libelf"
          SKIP_LIBS+="|libgio|libglib|libgobject|libgmodule"
          SKIP_LIBS+="|libz\.so|libbz2|libexpat|libxml2"
          SKIP_LIBS+="|libblkid|libmount|libnuma"
          SKIP_LIBS+="|libdrm|libva|libvdpau|libOpenCL"
          SKIP_LIBS+="|libcom_err|libgssapi|libkrb5|libk5crypto|libkeyutils"
          # GTK rendering stack — must match system GTK plugins/loaders.
          SKIP_LIBS+="|libcairo|libpango|libgdk_pixbuf|librsvg|libpixman"
          SKIP_LIBS+="|libharfbuzz|libfontconfig|libfreetype|libfribidi|libgraphite2|libthai|libdatrie"

          # Extract resolved lib paths from ldd output using awk (always exits 0,
          # unlike grep which returns 1 on no match and breaks pipefail).
          resolved_libs() {
            ldd "$1" 2>/dev/null | awk -v skip="$SKIP_LIBS" \
              '/=>/ && $3 ~ /^\// && $1 !~ skip {print $3}' | sort -u
          }

          # Pass 1: bundle direct + transitive deps shown by ldd on the binary
          resolved_libs "$BUILD/webui-rdp-client" > /tmp/libs_to_bundle.txt
          echo "Pass 1: $(wc -l < /tmp/libs_to_bundle.txt) libs from binary"

          while IFS= read -r lib; do
            name=$(basename "$lib")
            cp -L "$lib" "dist/rdpmanager/lib/$name"
            echo "  Bundled: $name"
          done < /tmp/libs_to_bundle.txt

          # Pass 2: recursively scan bundled libs for THEIR deps
          prev_count=0
          curr_count=$(ls dist/rdpmanager/lib/ | wc -l)
          pass=2
          while [ "$curr_count" -gt "$prev_count" ]; do
            prev_count=$curr_count
            new_libs=0
            for bundled in dist/rdpmanager/lib/*.so*; do
              resolved_libs "$bundled" | while IFS= read -r dep; do
                name=$(basename "$dep")
                if [ ! -f "dist/rdpmanager/lib/$name" ]; then
                  cp -L "$dep" "dist/rdpmanager/lib/$name"
                  echo "  Bundled (transitive): $name"
                fi
              done
            done
            curr_count=$(ls dist/rdpmanager/lib/ | wc -l)
            echo "Pass $pass: $(( curr_count - prev_count )) new libs"
            pass=$(( pass + 1 ))
          done

          echo ""
          echo "Total bundled: $(ls dist/rdpmanager/lib/ | wc -l) libraries"

          # Set RPATH so the binary finds bundled libs at $ORIGIN/lib
          patchelf --set-rpath '$ORIGIN/lib' dist/rdpmanager/webui-rdp-client

          # Create a convenience wrapper script
          cat > dist/rdpmanager/rdpmanager.sh << 'WRAPPER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$SCRIPT_DIR/webui-rdp-client" "$@"
          WRAPPER
          sed -i 's/^          //' dist/rdpmanager/rdpmanager.sh
          chmod +x dist/rdpmanager/rdpmanager.sh

          # Create .desktop launcher
          cat > dist/rdpmanager/rdpmanager.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=RDP Manager
          Exec=SCRIPT_DIR/rdpmanager.sh
          Icon=SCRIPT_DIR/appicon.png
          Terminal=false
          Categories=Network;RemoteAccess;
          DESKTOP
          sed -i 's/^          //' dist/rdpmanager/rdpmanager.desktop

          tar -czf dist/rdpmanager-linux-x86_64.tar.gz -C dist rdpmanager

      - name: Validate bundled libraries
        run: |
          set -euo pipefail

          # Same SKIP_LIBS as the packaging step
          SKIP_LIBS="linux-vdso|ld-linux"
          SKIP_LIBS+="|libc\.so|libm\.so|libdl\.so|librt\.so|libpthread\.so|libmvec\.so|libresolv\.so"
          SKIP_LIBS+="|libstdc\+\+|libgcc_s|libatomic|libgomp"
          SKIP_LIBS+="|libX[a-z0-9]|libxcb|libxkbfile|libxshmfence|libSM|libICE"
          SKIP_LIBS+="|libsystemd|libudev|libdbus"
          SKIP_LIBS+="|libicu"
          SKIP_LIBS+="|libffi|libpcre|libselinux|libcap|libgpg-error|libgcrypt|liblzma|libelf"
          SKIP_LIBS+="|libgio|libglib|libgobject|libgmodule"
          SKIP_LIBS+="|libz\.so|libbz2|libexpat|libxml2"
          SKIP_LIBS+="|libblkid|libmount|libnuma"
          SKIP_LIBS+="|libdrm|libva|libvdpau|libOpenCL"
          SKIP_LIBS+="|libcom_err|libgssapi|libkrb5|libk5crypto|libkeyutils"
          # GTK rendering stack — must match system GTK plugins/loaders.
          SKIP_LIBS+="|libcairo|libpango|libgdk_pixbuf|librsvg|libpixman"
          SKIP_LIBS+="|libharfbuzz|libfontconfig|libfreetype|libfribidi|libgraphite2|libthai|libdatrie"

          echo "=== Verifying every non-system dep is bundled ==="
          MISSING=0
          # Check every lib the binary needs (and every bundled lib needs)
          all_bins="dist/rdpmanager/webui-rdp-client"
          for so in dist/rdpmanager/lib/*.so*; do all_bins="$all_bins $so"; done

          for bin in $all_bins; do
            ldd "$bin" 2>/dev/null | awk '/=>/ && $3 ~ /^\// {print $1, $3}' | while read -r soname path; do
              if echo "$soname" | grep -qE "$SKIP_LIBS"; then
                continue
              fi
              if [ ! -f "dist/rdpmanager/lib/$soname" ]; then
                echo "MISSING: $soname (needed by $(basename "$bin"), resolved to $path)"
                # Signal missing via a marker file (subshell can't set parent vars)
                touch /tmp/.bundle_missing
              fi
            done
          done

          if [ -f /tmp/.bundle_missing ]; then
            echo ""
            echo "ERROR: Some required libraries are not in the bundle!"
            echo "The artifact will fail on systems without these libraries."
            exit 1
          fi
          echo "✓ All non-system libraries are bundled"
          echo ""
          echo "=== Bundled libraries ($(ls dist/rdpmanager/lib/ | wc -l)) ==="
          ls -lhS dist/rdpmanager/lib/
          echo ""
          echo "=== Package size ==="
          du -sh dist/rdpmanager-linux-x86_64.tar.gz

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpmanager-linux-x86_64
          path: dist/rdpmanager-linux-x86_64.tar.gz
          if-no-files-found: error
