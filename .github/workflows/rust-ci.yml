name: Rust CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rdpmanager-linux-x86_64
            binary: rdpmanager
          - os: windows-latest
            artifact: rdpmanager-windows-x86_64
            binary: rdpmanager.exe
          - os: macos-latest
            artifact: rdpmanager-macos-arm64
            binary: rdpmanager

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init Rust submodules
        run: |
          git submodule update --init --recursive crates/webui-sys/webui
          git submodule update --init --recursive crates/freerdp-sys/freerdp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            libclang-dev \
            zlib1g-dev \
            libssl-dev \
            libx11-dev \
            libxext-dev \
            libxcb1-dev \
            libxau-dev \
            libxdmcp-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxinerama-dev \
            x11proto-dev \
            libavcodec-dev \
            libavutil-dev \
            libavformat-dev \
            libswresample-dev \
            libswscale-dev \
            libasound2-dev \
            libcups2-dev \
            libusb-1.0-0-dev \
            libzstd-dev \
            libcjson-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Find existing OpenSSL or install it
          $sslPaths = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL-Win64"
          )
          $found = $false
          foreach ($p in $sslPaths) {
            if (Test-Path "$p\include\openssl\ssl.h") {
              echo "OPENSSL_ROOT_DIR=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "Found OpenSSL at $p"
              $found = $true
              break
            }
          }
          if (-not $found) {
            choco install openssl --no-progress -y
            # Re-check common paths after install
            foreach ($p in $sslPaths) {
              if (Test-Path "$p\include\openssl\ssl.h") {
                echo "OPENSSL_ROOT_DIR=$p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "Installed OpenSSL at $p"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: OpenSSL installation path not found, cmake will search"
            }
          }

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 cmake
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
