name: Patch Guard

on:
  push:
  pull_request:

jobs:
  verify-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git submodule update --init --recursive crates/freerdp-sys/freerdp
          git submodule update --init --recursive crates/webui-sys/webui

      - name: Verify all patches
        run: bash scripts/check-patches.sh
